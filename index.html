<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2a193f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="style.css"><title>Waifu Pocket</title></head><body><main><header><h1>♡ Waifu Pocket</h1><span id="mood">Happy ♡</span></header><section class="stage" id="stage"><div class="bubble" id="bubble">Tap me! ♡</div><div id="pet" role="button" aria-label="Pet your waifu" tabindex="0"><div class="hair-back"></div><div class="body"></div><div class="face"><div class="fringe"></div><div class="eyes"><i></i><i></i></div><div class="blush"></div><div class="mouth"></div></div><div class="bow">✿</div></div></section><section class="panel"><label>Character <select id="character"></select></label><label>Chaos <output id="chaosValue">50%</output><input id="chaos" type="range" min="0" max="100" value="50"></label><div id="stats"></div><div class="actions"><button id="feed">🍰 Feed</button><button id="play">🎮 Play</button><button id="sleep">💤 Nap</button><button id="petButton">💕 Pet</button></div><p class="hint">Your pet's progress saves on this device. Add to Home Screen from Safari's Share menu.</p></section></main><script src="app.js"></script></body></html>
